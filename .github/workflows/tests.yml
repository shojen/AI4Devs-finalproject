name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - 'arospe/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
    paths:
      - 'arospe/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arospe

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug
          extensions: imagick

      # GitHub-hosted Ubuntu runners ship libheif without its AVIF encoder plugin (the
      # encoder plugins were split into optional packages and are not installed by
      # default) — see https://github.com/actions/runner-images/issues/13728, closed by
      # GitHub as "not planned". Without this, Imagick can still DECODE avif but silently
      # writes a 0-byte blob on ENCODE instead of throwing, which is why
      # GenerateImageConversionsTest's avif byte-signature assertions fail here while
      # passing under Sail (whose php8.5-imagick apt install pulls this in as a
      # Recommends). Installed as its own step so it stays independent of how Setup PHP
      # resolves the imagick extension.
      - name: Install libheif AVIF encoder plugin
        run: sudo apt-get update && sudo apt-get install -y libheif-plugin-aomenc

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      # Browser used by spatie/browsershot (via puppeteer) for the opt-in real PDF render
      # smoke test. Cached on the lockfile because the pinned puppeteer version decides
      # which chrome-headless-shell build is downloaded.
      - name: Cache Puppeteer Browser
        id: puppeteer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('arospe/package-lock.json') }}

      - name: Install Puppeteer Browser (chrome-headless-shell)
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Install Playwright Browser (Chromium)
        run: npx --no playwright install --with-deps chromium

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Run Tests
        run: php artisan test --parallel

      # Opt-in real render (launches headless Chrome); skipped in the suite above unless
      # INVOICE_PDF_E2E is set. LARAVEL_PDF_NO_SANDBOX is required as the job runs as root.
      - name: Run Invoice PDF Render Smoke Test
        env:
          INVOICE_PDF_E2E: '1'
          LARAVEL_PDF_NO_SANDBOX: 'true'
        run: php artisan test tests/Feature/Invoices/Pdf/InvoicePdfSmokeTest.php
